<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML FORM</title>
</head>
<body>
    <h2>Create Form in HTML</h2>
    <form>
        <h3>Student Registration Form</h3>
        <label>Full Name</label><br>
        <input type="text" name="fullname" placeholder="Enter your full name" required><br><br>
        <label>Email</label><br>
        <input type="email" name="email" placeholder="Enter your email" required><br><br>
        <label>Password</label><br>
        <input type="password" name="password" placeholder="Enter your password" required><br><br>
        <label>Date of Birth</label><br>
        <input type="date" name="birthday" required><br><br>
        <label>Class</label><br> 
        <select name="class" required>
            <option value="">Select your class</option>
            <option value="classX-1">Class X-1</option>
            <option value="classX-2">Class X-2</option>
            <option value="classX-3">Class X-3</option>
            <option value="classX-4">Class X-4</option>
        </select><br><br>
        <label>Gender</label><br>
        <input type="radio" name="gender" value="male" required> Male<br>
        <input type="radio" name="gender" value="female" required> Female<br><br>
        <label>Skills</label><br>
        <input type="checkbox" name="skills" value="HTML" required> HTML<br>
        <input type="checkbox" name="skills" value="CSS" required> CSS<br>
        <input type="checkbox" name="skills" value="JavaScript" required> JavaScript<br><br>
        <label>About Yourself</label><br>
        <textarea name="about" rows="5" cols="40" placeholder="Tell us about yourself..." required></textarea><br><br>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
</body>
</html>
